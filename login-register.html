<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailKural - Login & Register</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/multilingual.css">
  <style>
    html {
      background: #0A1A44;
      background-size: 200% 200%;
      background-attachment: fixed;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    @keyframes blob1 {
      0%, 100% { 
        transform: translate(0, 0) scale(1);
        opacity: 0.5;
      }
      25% { 
        transform: translate(30px, -40px) scale(1.1);
        opacity: 0.6;
      }
      50% { 
        transform: translate(-20px, 30px) scale(0.9);
        opacity: 0.4;
      }
      75% { 
        transform: translate(-40px, -20px) scale(1.05);
        opacity: 0.5;
      }
    }

    @keyframes blob2 {
      0%, 100% { 
        transform: translate(0, 0) scale(1);
        opacity: 0.4;
      }
      25% { 
        transform: translate(-35px, 45px) scale(0.95);
        opacity: 0.5;
      }
      50% { 
        transform: translate(40px, -30px) scale(1.1);
        opacity: 0.35;
      }
      75% { 
        transform: translate(20px, 40px) scale(1);
        opacity: 0.45;
      }
    }

    @keyframes glow {
      0%, 100% { 
        box-shadow: 0 20px 60px rgba(255, 153, 51, 0.2), 0 0 40px rgba(10, 26, 68, 0.15);
      }
      50% { 
        box-shadow: 0 20px 80px rgba(255, 153, 51, 0.3), 0 0 60px rgba(19, 136, 8, 0.2);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 153, 51, 0.7); }
      50% { box-shadow: 0 0 0 10px rgba(255, 153, 51, 0); }
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .floating-particle {
      position: fixed;
      width: 6px;
      height: 6px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.8), transparent);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    }

    body {
      background: transparent;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      filter: blur(60px);
    }

    .orb-1 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 153, 51, 0.25), transparent 70%);
      top: 5%;
      left: 5%;
      animation: blob1 15s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 153, 51, 0.3), transparent 70%);
      bottom: -10%;
      right: -5%;
      animation: blob2 18s ease-in-out infinite;
    }

    .auth-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
      padding-top: 2rem;
      padding-bottom: 2rem;
    }

    .auth-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      animation: slideInUp 0.8s ease, glow 4s ease-in-out infinite;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 153, 51, 0.2);
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shimmer 3s infinite;
      z-index: 1;
      pointer-events: none;
    }

    .auth-card-header {
      background: #FF9933;
      color: white;
      padding: 3rem 2rem;
      border-radius: 15px 15px 0 0;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .auth-card-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
      animation: rotate 15s linear infinite;
      z-index: 0;
    }

    .auth-card-header h1,
    .auth-card-header p {
      position: relative;
      z-index: 1;
    }

    .auth-card-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    .auth-card-header::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: -50%;
      width: 150px;
      height: 150px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite reverse;
    }

    .auth-card-header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      position: relative;
      z-index: 2;
      animation: slideInDown 0.8s ease 0.2s both;
      letter-spacing: 1px;
    }

    .auth-card-header p {
      position: relative;
      z-index: 2;
      animation: slideInDown 0.8s ease 0.4s both;
      opacity: 0.95;
    }

    .auth-card-body {
      padding: 2.5rem;
      position: relative;
      z-index: 2;
    }

    .form-tabs {
      display: flex;
      border-bottom: 2px solid #eee;
      margin-bottom: 2rem;
    }

    .form-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      color: #999;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      animation: slideInDown 0.8s ease both;
      overflow: hidden;
    }

    .form-tab::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 153, 51, 0.1), transparent);
      transition: left 0.5s ease;
      z-index: 0;
    }

    .form-tab:hover {
      color: #FF9933;
      transform: translateY(-2px);
    }

    .form-tab:hover::before {
      left: 100%;
    }

    .form-tab.active {
      color: #FF9933;
      border-bottom-color: #FF9933;
      animation: pulse 0.5s ease;
      text-shadow: 0 0 20px rgba(255, 153, 51, 0.3);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
      animation: slideInUp 0.5s ease;
    }

    .form-group {
      margin-bottom: 1.5rem;
      animation: slideInUp 0.8s ease backwards;
      position: relative;
    }

    .form-group:nth-child(1) { animation-delay: 0.5s; }
    .form-group:nth-child(2) { animation-delay: 0.6s; }
    .form-group:nth-child(3) { animation-delay: 0.7s; }
    .form-group:nth-child(4) { animation-delay: 0.8s; }
    .form-group:nth-child(5) { animation-delay: 0.9s; }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 600;
      font-size: 0.95rem;
      position: relative;
      z-index: 1;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #eee;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: #f8f9fa;
      position: relative;
      z-index: 1;
    }

    .form-group input:focus {
      outline: none;
      border-color: #FF9933;
      background: white;
      box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.15), 0 0 25px rgba(255, 153, 51, 0.2);
      transform: scale(1.02) translateY(-2px);
    }

    .forgot-password {
      text-align: right;
      margin-bottom: 1.5rem;
    }

    .forgot-password a {
      color: #138808;
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      position: relative;
    }

    .forgot-password a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #138808;
      transition: width 0.3s ease;
    }

    .forgot-password a:hover {
      color: #FF9933;
    }

    .forgot-password a:hover::after {
      width: 100%;
      background: #FF9933;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-block;
      text-align: center;
      text-decoration: none;
      width: 100%;
      animation: slideInUp 0.8s ease 1s backwards;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.3);
      transition: left 0.3s ease;
      z-index: -1;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: #FF9933;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 153, 51, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 153, 51, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #138808;
      color: white;
      box-shadow: 0 4px 15px rgba(19, 136, 8, 0.3);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(19, 136, 8, 0.4);
    }

    .btn-secondary:active {
      transform: translateY(0);
    }

    .btn-block {
      width: 100%;
      display: block;
    }

    .divider {
      text-align: center;
      margin: 1.5rem 0;
      position: relative;
      animation: slideInUp 0.8s ease 1.1s backwards;
    }

    .divider:before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ddd, transparent);
    }

    .divider-text {
      background: white;
      padding: 0 1rem;
      position: relative;
      color: #999;
      font-size: 0.9rem;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .auth-card {
        margin: 1rem;
        border-radius: 12px;
      }

      .auth-card-header h1 {
        font-size: 1.5rem;
      }

      .auth-card-body {
        padding: 1.5rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    #department {
      width: 100% !important;
      min-height: 40px;
      padding: 8px 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    #department option {
      overflow: visible;
      white-space: normal;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1>🚆RailKural</h1>
      </div>

      <div class="auth-card-body">
        <div class="form-tabs">
          <div class="form-tab active" onclick="switchTab('passenger')">
            <span id="passengerTabText">Passenger</span>
          </div>
          <div class="form-tab" onclick="switchTab('staff')">
            <span id="staffTabText">Staff</span>
          </div>
        </div>

        <!-- Passenger Login Form -->
        <div id="passengerForm" class="form-section active">
          <h3 id="passengerLoginTitle" style="margin-bottom: 1.5rem; color: #333;">Passenger Login</h3>
          
          <form id="passengerLoginForm">
            <div class="form-group">
              <label id="passengerEmailLabel">Email or Mobile</label>
              <input type="text" class="form-control" id="passengerEmail" placeholder="Enter email or mobile">
            </div>

            <div class="form-group">
              <label id="passengerPasswordLabel">Password</label>
              <input type="password" class="form-control" id="passengerPassword" placeholder="Enter password">
            </div>

            <div class="forgot-password">
              <a href="#" id="passengerForgotLink">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="passengerLoginBtn">Login</button>
          </form>

          <p style="text-align: center; color: #666; margin-top: 1.5rem; font-size: 0.9rem;">
            <span id="noAccountText">Don't have an account?</span>
            <a href="/passenger-register.html" style="color: #138808; text-decoration: none; font-weight: 600;" id="registerLinkText">Register here</a>
          </p>
        </div>

        <!-- Staff Login Form -->
        <div id="staffForm" class="form-section">
          <h3 id="staffLoginTitle" style="margin-bottom: 1.5rem; color: #333;">Staff Login</h3>
          
          <form id="staffLoginForm">
            <div class="form-group">
              <label id="employeeIdLabel">Employee ID</label>
              <input type="text" class="form-control" id="employeeId" placeholder="Enter employee ID">
            </div>

            <div class="form-group">
              <label id="departmentLabel">Department</label>
              <select class="form-control" id="department">
                <option value="select">Select Department</option>
                <option value="Catering & Food Service Department">Catering & Food Service Department</option>
                <option value="Safety & Security">Safety & Security</option>
                <option value="Cleanliness">Cleanliness</option>
                <option value="Delay">Delay</option>
                <option value="Staff">Staff</option>
                <option value="Lost/Theft">Lost/Theft</option>
              </select>
            </div>

            <div class="form-group">
              <label id="staffPasswordLabel">Password</label>
              <input type="password" class="form-control" id="staffPassword" placeholder="Enter password">
            </div>

            <div class="forgot-password">
              <a href="#" id="staffForgotLink">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="staffLoginBtn">Login</button>
          </form>

          <p style="text-align: center; color: #666; margin-top: 1.5rem; font-size: 0.9rem;">
            <span id="noCredentialsText">Don't have credentials?</span>
            <a href="#" onclick="alert('Contact HR Department'); return false;" style="color: #138808; text-decoration: none; font-weight: 600;" id="hrContactLink">Contact HR</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/translations.js"></script>
  <script>
    let currentRole = 'passenger';

    // Language selector (add to HTML after styles close)
    const languageSelector = document.createElement('div');
    languageSelector.className = 'language-selector';
    languageSelector.innerHTML = `
      <button class="lang-btn active" onclick="switchLanguage('en')">EN</button>
      <button class="lang-btn" onclick="switchLanguage('hi')">HI</button>
      <button class="lang-btn" onclick="switchLanguage('ta')">TA</button>
    `;
    document.body.style.position = 'relative';

    // Initialize page with language
    function initializePage() {
      const lang = localStorage.getItem('language') || 'en';
      updatePageLanguage(lang);
    }

    // Update all text elements with translations
    function updatePageLanguage(lang) {
      document.getElementById('passengerTabText').textContent = lang === 'hi' ? 'यात्री' : lang === 'ta' ? 'பயணிகள்' : 'Passenger';
      document.getElementById('staffTabText').textContent = lang === 'hi' ? 'कर्मचारी' : lang === 'ta' ? 'பணியாளர்' : 'Staff';
      document.getElementById('passengerLoginTitle').textContent = lang === 'hi' ? 'यात्री लॉगिन' : lang === 'ta' ? 'பயணிகள் உள்நுழைவு' : 'Passenger Login';
      document.getElementById('staffLoginTitle').textContent = lang === 'hi' ? 'कर्मचारी लॉगिन' : lang === 'ta' ? 'பணியாளர் உள்நுழைவு' : 'Staff Login';
      document.getElementById('passengerEmailLabel').textContent = lang === 'hi' ? 'ईमेल या मोबाइल' : lang === 'ta' ? 'மின்னஞ்சல் அல்லது மொபைல்' : 'Email or Mobile';
      document.getElementById('passengerPasswordLabel').textContent = lang === 'hi' ? 'पासवर्ड' : lang === 'ta' ? 'கடவுச்சொல்' : 'Password';
      document.getElementById('employeeIdLabel').textContent = lang === 'hi' ? 'कर्मचारी आईडी' : lang === 'ta' ? 'பணியாளர் ID' : 'Employee ID';
      document.getElementById('departmentLabel').textContent = lang === 'hi' ? 'विभाग' : lang === 'ta' ? 'பிभाग' : 'Department';
      document.getElementById('staffPasswordLabel').textContent = lang === 'hi' ? 'पासवर्ड' : lang === 'ta' ? 'கடவுச்சொல்' : 'Password';
      document.getElementById('passengerLoginBtn').textContent = lang === 'hi' ? 'लॉगिन करें' : lang === 'ta' ? 'உள்நுழைக' : 'Login';
      document.getElementById('staffLoginBtn').textContent = lang === 'hi' ? 'लॉगिन करें' : lang === 'ta' ? 'உள்நுழைக' : 'Login';
      document.getElementById('passengerForgotLink').textContent = lang === 'hi' ? 'पासवर्ड भूल गए?' : lang === 'ta' ? 'கடவுச்சொல் மறந்துவிட்டீர்களா?' : 'Forgot Password?';
      document.getElementById('staffForgotLink').textContent = lang === 'hi' ? 'पासवर्ड भूल गए?' : lang === 'ta' ? 'கடவுச்சொல் மறந்துவிட்டீர்களா?' : 'Forgot Password?';
      document.getElementById('noAccountText').textContent = lang === 'hi' ? "खाता नहीं है?" : lang === 'ta' ? 'खाता नहीं है?' : "Don't have an account?";
      document.getElementById('noCredentialsText').textContent = lang === 'hi' ? "क्रेडेंशियल नहीं है?" : lang === 'ta' ? 'Credentials இல்லை?' : "Don't have credentials?";
    }

    function switchTab(tab) {
      currentRole = tab;
      document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.form-tab').forEach(el => el.classList.remove('active'));
      
      if (tab === 'passenger') {
        document.getElementById('passengerForm').classList.add('active');
        document.querySelectorAll('.form-tab')[0].classList.add('active');
      } else if (tab === 'staff') {
        document.getElementById('staffForm').classList.add('active');
        document.querySelectorAll('.form-tab')[1].classList.add('active');
      }
    }

    function switchLanguage(lang) {
      localStorage.setItem('language', lang);
      updatePageLanguage(lang);
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    // Passenger Form submission
    document.getElementById('passengerLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('passengerEmail').value;
      const password = document.getElementById('passengerPassword').value;
      
      if (!email || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      try {
        console.log('Attempting passenger login with:', email);
        const response = await fetch('http://127.0.0.1:5000/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, password, role: 'passenger' })
        });
        
        console.log('Login response status:', response.status);
        const data = await response.json();
        console.log('Login response data:', data);
        
        if (response.ok) {
          // Store passenger session
          localStorage.setItem('userRole', 'passenger');
          localStorage.setItem('userEmail', email);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userId', data.user.id);
          console.log('✓ Passenger login successful:', data.user);
          window.location.href = '/dashboard.html';
        } else {
          console.error('Login failed:', data.error);
          alert('Login failed: ' + data.error);
        }
      } catch (error) {
        console.error('Fetch/Login error:', error);
        alert('Connection error: ' + error.message + '\n\nEnsure API server is running on http://127.0.0.1:5000');
      }
    });

    // Staff Form submission
    document.getElementById('staffLoginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const empId = document.getElementById('employeeId').value;
      const dept = document.getElementById('department').value;
      const password = document.getElementById('staffPassword').value;
      
      if (!empId || !dept || !password) {
        alert('Please fill in all fields');
        return;
      }
      
      try {
        console.log('Attempting staff login with emp_id:', empId);
        const response = await fetch('http://127.0.0.1:5000/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email: empId, password, role: 'staff' })
        });
        
        console.log('Staff login response status:', response.status);
        const data = await response.json();
        console.log('Staff login response data:', data);
        
        if (response.ok) {
          // Store staff session
          localStorage.setItem('userRole', 'staff');
          localStorage.setItem('empId', empId);
          localStorage.setItem('department', dept);
          localStorage.setItem('userName', data.user.name);
          localStorage.setItem('userId', data.user.id);
          console.log('✓ Staff login successful:', data.user);
          window.location.href = '/department-dashboard.html';
        } else {
          console.error('Staff login failed:', data.error);
          alert('Login failed: ' + data.error);
        }
      } catch (error) {
        console.error('Fetch/Login error:', error);
        alert('Connection error: ' + error.message + '\n\nEnsure API server is running on http://127.0.0.1:5000');
      }
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initializePage);

    // Mouse movement parallax effect
    const authCard = document.querySelector('.auth-card');
    const orbs = document.querySelectorAll('.orb');
    
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    
    // Create floating particles with repulsion physics
    const particles = [];
    
    function createFloatingParticles() {
      for (let i = 0; i < 60; i++) {
        const particle = document.createElement('div');
        particle.className = 'floating-particle';
        
        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.animation = `float ${3 + Math.random() * 4}s ease-in-out infinite`;
        particle.style.animationDelay = Math.random() * 2 + 's';
        particle.style.position = 'fixed';
        document.body.appendChild(particle);
        
        particles.push({
          element: particle,
          x: x,
          y: y,
          baseX: x,
          baseY: y,
          vx: 0,
          vy: 0
        });
      }
    }
    
    createFloatingParticles();
    
    // Particle repulsion and physics
    function updateParticles() {
      particles.forEach(particle => {
        const dx = particle.x - mouseX;
        const dy = particle.y - mouseY;
        const distSq = dx * dx + dy * dy;
        const repulsionDistSq = 40000; // 200^2
        
        if (distSq < repulsionDistSq && distSq > 1) {
          const distance = Math.sqrt(distSq);
          const force = (200 - distance) * 0.008;
          const angle = Math.atan2(dy, dx);
          
          particle.vx += Math.cos(angle) * force;
          particle.vy += Math.sin(angle) * force;
        } else {
          // Snap back to original position faster
          const returnSpeed = 0.15;
          particle.vx = (particle.baseX - particle.x) * returnSpeed;
          particle.vy = (particle.baseY - particle.y) * returnSpeed;
        }
        
        particle.vx *= 0.88;
        particle.vy *= 0.88;
        
        particle.x += particle.vx;
        particle.y += particle.vy;
        
        // Bounds checking with wrap-around
        if (particle.x < -10) particle.x = window.innerWidth + 10;
        if (particle.x > window.innerWidth + 10) particle.x = -10;
        if (particle.y < -10) particle.y = window.innerHeight + 10;
        if (particle.y > window.innerHeight + 10) particle.y = -10;
        
        particle.element.style.left = particle.x + 'px';
        particle.element.style.top = particle.y + 'px';
      });
      
      requestAnimationFrame(updateParticles);
    }
    
    updateParticles();
    
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      targetX = (e.clientX / window.innerWidth) * 100;
      targetY = (e.clientY / window.innerHeight) * 100;
      
      // Card complex 3D tilt effect with smooth easing
      if (authCard) {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        
        const tiltX = (y - 0.5) * 6;
        const tiltY = (x - 0.5) * 6;
        const scaleZ = 1 + (1 - Math.abs(x - 0.5) * 2) * 0.05;
        
        authCard.style.transform = `
          perspective(1200px) 
          rotateX(${tiltX}deg) 
          rotateY(${tiltY}deg)
          translateZ(20px)
          scale(${scaleZ})
        `;
        
        // Add glow effect following mouse
        authCard.style.boxShadow = `
          ${(x - 0.5) * 20}px ${(y - 0.5) * 20}px 40px rgba(255, 153, 51, 0.3),
          0 20px 60px rgba(255, 153, 51, 0.2),
          0 0 40px rgba(10, 26, 68, 0.15)
        `;
      }
      
      // Move background orbs slightly with mouse
      orbs.forEach((orb, index) => {
        const moveX = (e.clientX / window.innerWidth - 0.5) * 50;
        const moveY = (e.clientY / window.innerHeight - 0.5) * 50;
        const intensity = index === 0 ? 1.2 : 0.8;
        
        orb.style.transform = `translate(${moveX * intensity}px, ${moveY * intensity}px)`;
      });
    });

    // Reset card on mouse leave
    document.addEventListener('mouseleave', () => {
      if (authCard) {
        authCard.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg) translateZ(0) scale(1)';
        authCard.style.boxShadow = '0 20px 60px rgba(255, 153, 51, 0.2), 0 0 40px rgba(10, 26, 68, 0.15)';
      }
      
      orbs.forEach(orb => {
        orb.style.transform = 'translate(0, 0)';
      });
    });
    
    // Interactive hover effects on form elements
    const formInputs = document.querySelectorAll('.form-control');
    formInputs.forEach(input => {
      input.addEventListener('focus', function(e) {
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        this.style.boxShadow = `
          0 0 0 3px rgba(255, 153, 51, 0.2),
          0 0 20px rgba(255, 153, 51, 0.3),
          inset 0 0 20px rgba(255, 153, 51, 0.05)
        `;
      });
      
      input.addEventListener('blur', function() {
        this.style.boxShadow = '';
      });
    });
    
    // Button hover animation enhancement
    const buttons = document.querySelectorAll('.btn');
    buttons.forEach(btn => {
      btn.addEventListener('mouseenter', function() {
        if (this.classList.contains('btn-primary')) {
          this.style.boxShadow = `
            0 10px 30px rgba(255, 153, 51, 0.5),
            0 0 40px rgba(255, 153, 51, 0.3)
          `;
        } else {
          this.style.boxShadow = `
            0 10px 30px rgba(19, 136, 8, 0.5),
            0 0 40px rgba(19, 136, 8, 0.3)
          `;
        }
      });
      
      btn.addEventListener('mouseleave', function() {
        if (this.classList.contains('btn-primary')) {
          this.style.boxShadow = '0 4px 15px rgba(255, 153, 51, 0.3)';
        } else {
          this.style.boxShadow = '0 4px 15px rgba(19, 136, 8, 0.3)';
        }
      });
    });
  </script>
</body>
</html>
